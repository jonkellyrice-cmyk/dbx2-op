benchmarks:
  metrics:
  - id: loadout_ki
    label: Upfront Ki to cast each equipped Super once
    unit: ki_bars
    computable: true
    calculation: Sum known baseline activation Ki costs for non-null equipped Super slots; unknown if any required baseline
      cost unknown
    spec_ref: §23.1
  - id: evasive_stamina_cost
    label: Baseline stamina cost of equipped Evasive
    unit: stamina_bars
    computable: true
    calculation: Sum known upfront Evasive stamina cost (single Evasive), else unknown
    spec_ref: §23.1
  - id: break_tool_count
    label: Distinct evidenced stamina/guard break tools
    unit: tools
    computable: true
    calculation: Count confirmed viable tools, de-duplicate duplicate outcomes; mode target resistance can exclude
    spec_ref: §23.1
  - id: aoe_tool_count
    label: Distinct evidenced area-of-effect tools
    unit: tools
    computable: true
    calculation: Count catalog flags.aoe known true with executable role tags
    spec_ref: §23.1
  - id: damage_per_ki
    label: Damage per bar of Ki in fixed punish test
    unit: damage_per_ki_bar
    computable: false
    calculation: Measured damage divided by Ki consumed; zero-Ki attacks separately report damage and undefined ratio
    spec_ref: §23.1
  - id: damage_per_punish_window
    label: Punish damage in fixed window
    unit: damage_units
    computable: false
    calculation: Measured total damage during scenario-defined opponent vulnerability window
    spec_ref: §23.1
  - id: sustained_dps
    label: Sustained damage throughput
    unit: damage_per_second
    computable: false
    calculation: Measured damage over fixed-duration valid rotation trials
    spec_ref: §23.1
  - id: net_ki_per_rotation
    label: Net Ki gained/spent per rotation
    unit: ki_bars
    computable: false
    calculation: Measure post-rotation minus pre-rotation Ki including conditional refunds
    spec_ref: §23.1
  - id: stamina_margin
    label: Recovery minus expenditure over fixed encounter
    unit: stamina_bars
    computable: false
    calculation: Measure gained stamina minus consumed stamina using identical encounter
    spec_ref: §23.1
  - id: clear_time
    label: Fixed PQ clear time
    unit: seconds
    computable: false
    calculation: Elapsed in-game duration for defined PQ and objectives
    spec_ref: §23.1
  - id: survival_time
    label: Survival against matched pressure
    unit: seconds
    computable: false
    calculation: Elapsed time until KO/failure under fixed enemy scripted/observed pressure
    spec_ref: §23.1
  - id: multi_target_hit_rate
    label: Multi-target contact rate
    unit: fraction
    computable: false
    calculation: Distinct enemies hit / eligible enemies in fixed trial, [0,1]
    spec_ref: §23.1
