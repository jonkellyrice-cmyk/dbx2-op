goals:
- id: burst_damage
  label: Burst damage
  definition: Damage deliverable in a verified short punish window after a confirmed opening.
  zero: 'Catalog-grade 0: verified absence of useful burst damage contribution from this option.'
  hundred: 'Catalog-grade 100: top anchored, strongly evidenced single-option burst damage contribution; not a performance
    measurement.'
  inputs:
  - tactical_grades.burst_damage
  - catalog.role_tags
  - catalog.flags
  - catalog.effect_clauses
  - catalog.cost_schedule
  gap_advice: Add an executable high-damage punish or reliable confirm; measure the result.
  spec_ref: §19.1
  criteria:
  - id: tactical_grade
    method: ordinal_0_5
    weight: 0.65
    inputs:
    - tactical_grades.burst_damage
    saturation_count: null
    ascending: null
    ordinal_anchors:
      '1': Narrow, costly or highly conditional effect
      '3': Practical tool under ordinary conditions
      '5': Reliable strong tool with excellent utility per slot
    function: null
  - id: capability_count
    method: count_saturation
    weight: 0.2
    inputs:
    - catalog.role_tags
    - catalog.flags
    - catalog.effect_clauses
    saturation_count: 2
    ascending: true
    ordinal_anchors:
      '1': One narrowly evidenced capability
      '3': Two related documented capabilities
      '5': Several independently useful effects
    function: goal_capability_count
  - id: known_feature
    method: boolean_coverage
    weight: 0.15
    inputs:
    - catalog.flags
    - catalog.role_tags
    - catalog.effect_clauses
    saturation_count: null
    ascending: null
    ordinal_anchors:
      '1': No demonstrated feature
