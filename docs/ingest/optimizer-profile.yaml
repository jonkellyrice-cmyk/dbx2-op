scoring:
  unknown_policy: Null with explicit unknown status; NEVER zero-fill; VERIFY ignored until measured/accepted; report
    evidence coverage
  minimum_goal_coverage: 0.6
  minimum_comparison_coverage: 0.8
  tactical_scale:
    min: 0
    max: 5
    anchors:
      '1': Situational, costly or unreliable
      '3': Reliable in ordinary scenarios with ordinary limitations
      '5': Highly reliable, repeatable, well evidenced in relevant scenario
  normalization:
    ordinal_0_5: score=20*grade; unknown if grade is unknown
    count_saturation: score=100*min(max(count,0),saturation_count)/saturation_count; requires evidenced count
    boolean_coverage: known true=100; known false=0; unknown=null
    rule_derived: Apply the named function in scoring.derivation_functions, output 0–100; unknown/NA preserved
  rank_weights:
    '1': 8
    '2': 6
    '3': 4
    '4': 3
    '5': 2
    '6': 1
    '7': 1
    '8': 1
  not_applicable_policy: Exclude criterion from denominator only if structurally inapplicable for this option; record
    reason and source path
  relation_bands:
    minor: 5
    moderate: 10
    major: 30
  relation_application:
    eligible: state=confirmed AND evidence supports cause and band size AND non_overlap=passed
    candidate: always explain_only; numeric adjustment=0
    signed_effect: synergy=+band; anti_synergy=-band; redundancy=-band
    aggregation: Once per unordered option pair and goal; do not count duplicate generators; clamp after all effects
      to [0,100]
    scope: Applies only when both options are equipped and executable in context; never to raw rate(option)
    uncertain: Missing size or eligibility -> candidate, never estimate points
  derivation_functions:
    goal_capability_count:
      definition: Count distinct documented supported capabilities (not number of overlapping tags); cap at saturation_count;
        use role tags, effect operations and verified flags; known absent is zero; if relevant fields incompletely characterized
        return unknown.
      goal_tags: &id001
        burst_damage:
        - burst_damage
        - combo_start
        - stamina_break
        - guard_break
        sustained_damage:
        - sustained_damage
        - combo_extend
        - ki_generate
        - resource_refund
        ki_economy:
        - ki_generate
        - ki_charge
        - resource_refund
        stamina_safety:
        - stamina_regen
        - stamina_preserve
        - escape
        - counter
        control:
        - stamina_break
        - guard_break
        - hitstun
        - paralysis
        - counter
        - guard_pressure
        mobility:
        - gap_close
        - reposition
        - tracking
        crowd_handling:
        - area_damage
        - area_denial
        - crowd_control
        - reflect
        survivability:
        - heal
        - damage_mitigation
        - escape
        - revive
        - counter
      goal_flags: &id002
        burst_damage:
        - hit
        - stamina_break
        - guard_break
        sustained_damage:
        - hit
        - tracking
        ki_economy: []
        stamina_safety:
        - invulnerability
        - super_armor
        - auto_dodge
        control:
        - guard_break
        - stamina_break
        - armor_answer
        mobility:
        - reposition
        - tracking
        crowd_handling:
        - aoe
        survivability:
        - invulnerability
        - super_armor
      source: option.role_tags, option.flags, option.effect_clauses or option.effects; QQ Bang stat_modifiers may support
        only stat-related goals
    goal_feature_present:
      definition: True only for a known effective goal flag/tag/clause; false only when all applicable evidence-bearing
        fields are characterized; otherwise unknown. Not applicable for QQ Bangs with no applicable effect representation.
      goal_tags: *id001
      goal_flags: *id002
    ki_cost_fitness:
      definition: 'From documented upfront activation Ki cost only: 100*clamp(1 - bars/5,0,1). Zero cost ->100 only for
        a cost-bearing attack; for non-attack types with no Ki spending operation -> not_applicable. If activation cost
        unknown -> unknown. Refunds/conditional restores are graded separately; never treat optimistic conditional refund
        as guaranteed.'
      units: ki_bars
      ceiling_bars: 5
    stamina_cost_fitness:
      definition: 'From documented upfront stamina cost only: 100*clamp(1 - bars/5,0,1). For options without stamina
        spending mechanics use not_applicable; if cost not evidenced use unknown. Automatic dodges can have event-dependent
        costs, requiring tactical_grade evidence until quantified.'
      units: stamina_bars
      ceiling_bars: 5
  fully_characterized_min_coverage: 0.65
relation_generators:
- id: G-001
  when: soul.clauses[].trigger.predicates contains path=event.skill_id operator=eq value=skill.id
  kind: synergy
  goal: from_effect_clause_goal
  weight_band: moderate
  evidence_policy: candidate if trigger VERIFY; confirmed only when source supports cause and magnitude; confirmed needs
    cause evidence, supported band magnitude, and non-overlap check
  contribution_policy: apply_band_if_confirmed_and_incremental_else_explain_only
  spec_ref: §21.2
- id: G-002
  when: two active skills have evidenced role_tag=ki_charge with substantially overlapping windows
  kind: redundancy
  goal: ki_economy
  weight_band: minor
  evidence_policy: must compare opportunity costs; not full redundancy merely from matching tag; confirmed needs cause
    evidence, supported band magnitude, and non-overlap check
  contribution_policy: apply_band_if_confirmed_and_incremental_else_explain_only
  spec_ref: §21.2
- id: G-003
  when: awoken.action_overrides includes action=charge added, and a charge Super is equipped
  kind: redundancy
  goal: ki_economy
  weight_band: moderate
  evidence_policy: must verify charge is available in transformed state; confirmed needs cause evidence, supported band
    magnitude, and non-overlap check
  contribution_policy: apply_band_if_confirmed_and_incremental_else_explain_only
  spec_ref: §21.2
- id: G-004
  when: awoken role/effect shows auto_dodge stamina drain and other source shows stamina recovery
  kind: synergy
  goal: stamina_safety
  weight_band: moderate
  evidence_policy: candidate unless cost vs recovery measured in same mode; confirmed needs cause evidence, supported
    band magnitude, and non-overlap check
  contribution_policy: apply_band_if_confirmed_and_incremental_else_explain_only
  spec_ref: §21.2
- id: G-005
  when: effects share exclusive state family and precedence verifies overwrite
  kind: anti_synergy
  goal: survivability
  weight_band: minor
  evidence_policy: no penalty if both coexist or information is unknown; confirmed needs cause evidence, supported band
    magnitude, and non-overlap check
  contribution_policy: apply_band_if_confirmed_and_incremental_else_explain_only
  spec_ref: §21.2
- id: G-006
  when: target_context armor_type known incompatible with option effect
  kind: anti_synergy
  goal: control
  weight_band: major
  evidence_policy: only within a specified scenario with observed compatibility; confirmed needs cause evidence, supported
    band magnitude, and non-overlap check
  contribution_policy: apply_band_if_confirmed_and_incremental_else_explain_only
  spec_ref: §21.2
blockers:
- id: B-ARMOR
  modes:
  - expert_mission
  test: if scenario.requires_armor_answer then exists evidenced armor_answer role_tag usable on target
  message: No verified answer to this Expert Mission boss’s Super Armor.
  severity: flag_not_ranked_if_failed
  verification_requirement: Only evaluate if scenario.requires_armor_answer=true and target armor evidence exists
  spec_ref: §22.2
- id: B-ESCORT
  modes:
